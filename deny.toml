# cargo-deny policy (ADR-0007, ADR-0011). Enforced in CI; run locally with `cargo deny check`.

[graph]
all-features = true

[advisories]
yanked = "deny"

[licenses]
# Permissive licences only. Copyleft and non-commercial terms are rejected (REQ-VOI-009, ADR-0007).
allow = [
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "MIT",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Unicode-3.0",
  "Zlib",
  "CC0-1.0",
  # The Mozilla root certificate list bundled by webpki-roots (needed for HTTPS). A permissive data licence;
  # it asks only that the licence and attribution travel with the data (see NOTICE).
  "CDLA-Permissive-2.0",
]
confidence-threshold = 0.9

[bans]
multiple-versions = "warn"
wildcards = "deny"
# Workspace crates depend on each other by path, which cargo-deny otherwise reports as a wildcard version.
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
