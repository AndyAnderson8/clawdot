name: Bug
description: Behaviour that deviates from an Accepted spec
labels: ["type:bug"]
body:
  - type: input
    id: spec
    attributes:
      label: Violated requirement ID(s)
      placeholder: "REQ-TMR-002 (or 'spec is silent')"
  - type: dropdown
    id: severity
    attributes:
      label: Severity
      options:
        - S1 - security, data loss, bricked device
        - S2 - core feature broken
        - S3 - degraded behaviour
        - S4 - cosmetic
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected vs actual
    validations:
      required: true
  - type: textarea
    id: env
    attributes:
      label: Environment
      description: Version/commit, target (desktop / armv7 / device), satellite, providers. Do not paste API keys or audio.
  - type: markdown
    attributes:
      value: "Security issue? Do not file it here. See SECURITY.md."
