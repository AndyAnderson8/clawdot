name: ci

# Required status check on dev and main: the `gate` job.
# Candidate refs (ci/**) are pushed by scripts/land.sh so the exact commit that will be published
# is verified before it reaches a protected branch.
on:
  push:
    branches:
      - main
      - dev
      - "feature/**"
      - "bugfix/**"
      - "hotfix/**"
      - "release/**"
      - "docs/**"
      - "chore/**"
      - "spike/**"
      - "integration/**"
      - "ci/**"
  pull_request:
    branches: [dev, main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  detect:
    runs-on: ubuntu-latest
    outputs:
      rust: ${{ steps.d.outputs.rust }}
      portal: ${{ steps.d.outputs.portal }}
    steps:
      - uses: actions/checkout@v7
      - id: d
        run: |
          if [ -f Cargo.toml ]; then echo "rust=true" >> "$GITHUB_OUTPUT"; else echo "rust=false" >> "$GITHUB_OUTPUT"; fi
          if [ -f portal/package.json ]; then echo "portal=true" >> "$GITHUB_OUTPUT"; else echo "portal=false" >> "$GITHUB_OUTPUT"; fi

  commits:
    name: commits (conventional, human-only)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Check commit messages and identities
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          base="${BASE_SHA:-}"
          if [ -z "$base" ] || [ "$base" = "0000000000000000000000000000000000000000" ]; then
            base=$(git merge-base origin/dev "$HEAD_SHA" 2>/dev/null || git rev-list --max-parents=0 "$HEAD_SHA" | tail -1)
          fi
          scripts/check-commit-msg.sh --range "$base..$HEAD_SHA"

  docs:
    name: docs (links, requirement IDs)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: scripts/check-docs.sh
      - name: Personal-data guard (hashed denylist, see docs/process/personal-data.md)
        run: node scripts/check-personal.mjs

  scripts:
    name: scripts (shellcheck)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: |
          for f in scripts/*.sh .githooks/* .claude/hooks/*.sh; do bash -n "$f"; done
          shellcheck -x scripts/*.sh .githooks/* .claude/hooks/*.sh
          scripts/test-policy.sh

  rust:
    name: rust (fmt, clippy, test, deny)
    needs: detect
    if: needs.detect.outputs.rust == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          components: rustfmt, clippy
      - name: Formatting
        run: cargo fmt --all --check
      - name: Lint and type-check (warnings are errors)
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Unit and integration tests
        run: cargo test --workspace --locked
      - name: Dependency policy
        if: hashFiles('deny.toml') != ''
        uses: EmbarkStudios/cargo-deny-action@v2

  # Feature combinations on x86_64 (architecture review D1). `default` repeats the `rust` job on purpose: it keeps
  # the three variants side by side, and the cache makes it cheap.
  features:
    name: "features (${{ matrix.name }}: clippy, test)"
    needs: detect
    if: needs.detect.outputs.rust == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: default
            flags: ""
          - name: all-features
            flags: "--all-features"
          - name: no-default-features
            flags: "--no-default-features"
    steps:
      - uses: actions/checkout@v7
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          components: clippy
          cache-key: features-${{ matrix.name }}
      - name: Lint (warnings are errors)
        run: cargo clippy --workspace --all-targets --locked ${{ matrix.flags }} -- -D warnings
      - name: Tests
        run: cargo test --workspace --locked ${{ matrix.flags }}

  # The binary that actually runs on the Echo Dot Gen 2 (architecture review D1, spec 0002 REQ-NFR-103):
  # armv7 musl, release profile (stripped, see Cargo.toml), the default features plus the Dot's.
  #   dot  = esphome-satellite,esphome-noise              what dot-ssh.md deploys
  #   full = dot + hive,realtime                          everything the Dot could run
  # Built with `cross` (container with a musl gcc), pinned below. Chosen over cargo-zigbuild because it needs no
  # linker wrappers and the image is a fixed, versioned toolchain, so the result does not move with a zig release;
  # the cost is the image pull. Fails when the stripped binary is over 8 MiB; the size and the change since the
  # last recorded measurement go to the job summary, and the binary is kept as a workflow artifact.
  dot-build:
    name: "dot build (armv7 musl, ${{ matrix.name }}) and size budget"
    needs: detect
    if: needs.detect.outputs.rust == 'true'
    runs-on: ubuntu-latest
    env:
      CROSS_VERSION: "0.2.5"
      # SHA-256 of cross-x86_64-unknown-linux-gnu.tar.gz from the v0.2.5 release.
      CROSS_SHA256: "642375d1bcf3bd88272c32ba90e999f3d983050adf45e66bd2d3887e8e838bad"
      TARGET: armv7-unknown-linux-musleabihf
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: dot
            features: "esphome-satellite,esphome-noise"
          - name: full
            features: "esphome-satellite,esphome-noise,hive,realtime"
    steps:
      - uses: actions/checkout@v7
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          cache-key: dot-${{ matrix.name }}
      - name: Install cross (pinned, checksum verified)
        run: |
          curl -sSfL -o "$RUNNER_TEMP/cross.tgz" \
            "https://github.com/cross-rs/cross/releases/download/v${CROSS_VERSION}/cross-x86_64-unknown-linux-gnu.tar.gz"
          echo "${CROSS_SHA256}  $RUNNER_TEMP/cross.tgz" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/cross-bin"
          tar -xzf "$RUNNER_TEMP/cross.tgz" -C "$RUNNER_TEMP/cross-bin"
          echo "$RUNNER_TEMP/cross-bin" >> "$GITHUB_PATH"
      - name: Build
        run: |
          # The container cannot read the checkout's git data; pass the commit in (see Cross.toml).
          CLAWDOT_BUILD_COMMIT=$(git rev-parse --short=9 HEAD)
          export CLAWDOT_BUILD_COMMIT CLAWDOT_BUILD_DIRTY=0
          cross build --release --locked --target "$TARGET" -p clawdot-core --bin clawdot --features "${{ matrix.features }}"
      - name: Size budget (spec 0002, 8 MiB)
        run: bash .github/scripts/dot-size.sh "${{ matrix.name }}" "target/${TARGET}/release/clawdot"
      - name: Keep the binary
        uses: actions/upload-artifact@v4
        with:
          name: clawdot-armv7-${{ matrix.name }}
          path: target/${{ env.TARGET }}/release/clawdot
          if-no-files-found: error
          retention-days: 14

  portal:
    name: portal (npm ci, lint, format, types, tests, built page is current, browser)
    needs: detect
    if: needs.detect.outputs.portal == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: portal
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version-file: portal/.nvmrc
          cache: npm
          cache-dependency-path: |
            portal/package-lock.json
            portal/lint/package-lock.json
      - name: Install (lock files only, no install scripts)
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npm ci --ignore-scripts --no-audit --no-fund --prefix lint
      - name: Lint (ESLint, type-aware)
        run: npm run lint
      - name: Formatting (Prettier)
        run: npm run format:check
      - name: Type-check
        run: npm run typecheck
      - name: Unit tests
        run: npm test
      - name: Licences and advisories
        run: |
          npm run licenses
          npm run audit
      - name: Rebuild the page and fail if the committed copy differs
        run: |
          npm run build
          git diff --exit-code -- ../crates/core/src/ui.html
      - name: Browser smoke test (headless Chrome against a mock device)
        run: npm run test:browser
        env:
          CI: "true"
          CHROME: /usr/bin/google-chrome

  release-check:
    name: release readiness
    if: startsWith(github.ref, 'refs/heads/release/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - run: scripts/check.sh --release "${GITHUB_REF_NAME#release/}"

  gate:
    name: gate
    if: always()
    needs: [detect, commits, docs, scripts, rust, features, dot-build, portal, release-check]
    runs-on: ubuntu-latest
    steps:
      - name: Every required job passed (skipped jobs are fine)
        run: |
          echo '${{ toJSON(needs) }}'
          if ${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}; then
            echo "A required job failed."; exit 1
          fi
