# git-cliff configuration: generates CHANGELOG.md and release notes from Conventional Commits.
# Docs: https://git-cliff.org/docs/configuration
# NOTE: written before git-cliff was available locally; first verified when `scripts/release.sh prepare` runs.

[changelog]
header = """
# Changelog

All notable changes are documented here. This file is generated from Conventional Commits by
git-cliff at release time; do not edit it by hand. Versioning follows [SemVer](https://semver.org).
The satellite protocol is versioned separately (`protocol-vMAJOR.MINOR`).

"""
body = """
{% if version %}\
## [{{ version | trim_start_matches(pat="v") }}] - {{ timestamp | date(format="%Y-%m-%d") }}
{% else %}\
## [Unreleased]
{% endif %}\
{% for group, commits in commits | group_by(attribute="group") %}
### {{ group | upper_first }}
{% for commit in commits %}\
- {% if commit.scope %}**{{ commit.scope }}:** {% endif %}{{ commit.message | upper_first }}\
{% if commit.breaking %} **(BREAKING)**{% endif %} ({{ commit.id | truncate(length=7, end="") }})
{% endfor %}
{% endfor %}
"""
trim = true
footer = ""

[git]
conventional_commits = true
filter_unconventional = true
split_commits = false
protect_breaking_commits = true
filter_commits = false
tag_pattern = "v[0-9]*"
sort_commits = "oldest"
commit_parsers = [
  { message = "^chore\\(release\\)", skip = true },
  { message = "^feat", group = "Added" },
  { message = "^fix", group = "Fixed" },
  { message = "^perf", group = "Performance" },
  { message = "^refactor", group = "Changed" },
  { message = "^spec", group = "Specifications" },
  { message = "^docs", group = "Documentation" },
  { message = "^test", group = "Tests" },
  { message = "^(build|ci|chore)", group = "Maintenance" },
  { message = "^revert", group = "Reverted" },
]

[bump]
# Pre-1.0: a breaking change bumps the minor version; features bump minor; fixes bump patch.
features_always_bump_minor = true
breaking_always_bump_major = false
initial_tag = "0.1.0"
