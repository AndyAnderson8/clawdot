      operationId: deleteTool
      parameters:
        - $ref: "#/components/parameters/name"
      responses:
        "200":
          description: Deleted; the new listing.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ExtListing" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "503": { $ref: "#/components/responses/Unavailable" }
  /api/tools/{name}/enabled:
    post:
      tags: [Tools]
      summary: Turn a tool on or off
      operationId: setToolEnabled
      parameters:
        - $ref: "#/components/parameters/name"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/EnabledFlag" }
      responses:
        "200":
          description: Done; the new listing.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ExtListing" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "503": { $ref: "#/components/responses/Unavailable" }
  /api/tools/{name}/tier:
    post:
      tags: [Tools]
      summary: Set a tool's risk tier
      description: |
        `null` goes back to the tier the tool was declared with. The tier decides what needs a spoken yes
        (REQ-SEC-030). The request is parsed as one of `read_only`, `reversible`, `costly`, `destructive`; the
        error text names only the first three, and the main loop may still refuse a value for a given tool.
      operationId: setToolTier
      parameters:
        - $ref: "#/components/parameters/name"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [tier]
              properties:
                tier:
                  oneOf:
                    - { $ref: "#/components/schemas/Tier" }
                    - { type: "null" }
      responses:
        "200":
          description: Done; the new listing.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ExtListing" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "503": { $ref: "#/components/responses/Unavailable" }
  /api/connections:
    post:
      tags: [Tools]
      summary: Add and connect an MCP server
      description: The server is connected before it is saved. Its token is read from the environment variable named in `auth_env`; the variable's value never appears in any response.
      operationId: addConnection
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ServerDef" }
      responses:
        "200":
          description: Added; the new listing.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ExtListing" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "503": { $ref: "#/components/responses/Unavailable" }
  /api/connections/test:
    post:
      tags: [Tools]
      summary: Try an MCP connection without saving it
      operationId: testConnection
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ServerDef" }
      responses:
        "200":
          description: The server answered. This is the report for that one server.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ConnectionTest" }
        "400":
          description: The connection is described wrongly or the server did not answer; the message says what to check.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "429": { $ref: "#/components/responses/RateLimited" }
  /api/connections/{name}:
    delete:
      tags: [Tools]
      summary: Remove an MCP server added in the portal
      operationId: deleteConnection
      parameters:
        - $ref: "#/components/parameters/name"
      responses:
        "200":
          description: Removed; the new listing.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ExtListing" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "503": { $ref: "#/components/responses/Unavailable" }
  /api/connections/{name}/enabled:
    post:
      tags: [Tools]
      summary: Turn an MCP server on or off
      operationId: setConnectionEnabled
      parameters:
        - $ref: "#/components/parameters/name"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/EnabledFlag" }
      responses:
        "200":
          description: Done; the new listing.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ExtListing" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "503": { $ref: "#/components/responses/Unavailable" }
  /api/connections/{name}/accept:
    post:
      tags: [Tools]
      summary: Accept what an MCP server now offers
      description: >-
        A tool of a connection is offered to the model only as the administrator approved it. A tool that is new,
        or whose description or arguments differ from what was approved, is listed under the connection's
        `needs_review` and is neither offered nor callable. This records what those tools are now and offers them.
        An empty body (or `{}`) accepts every tool of the connection that waits; `{"tool": "<name>"}` accepts one,
        by the name the model sees. Accepting when nothing waits is a no-op. The tool's tier and on/off setting are
        kept. Administrator only.
      operationId: acceptConnectionTools
      parameters:
        - $ref: "#/components/parameters/name"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                tool: { type: string, description: "The exposed name, for example `home__lamp`." }
      responses:
        "200":
          description: Done; the new listing.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ExtListing" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "503": { $ref: "#/components/responses/Unavailable" }
  /api/skills:
    get:
      tags: [Tools]
      summary: Tools, connections and skills
      description: The same document as `GET /api/tools`.
      operationId: listSkills
      responses:
        "200":
          description: The listing.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ExtListing" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "429": { $ref: "#/components/responses/RateLimited" }
    post:
      tags: [Tools]
      summary: Add a skill
      description: Up to 16 skills; the name is unique, up to 40 characters; instructions up to 2000 characters.
      operationId: addSkill
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SkillBody" }
      responses:
        "200":
          description: Added; the new listing.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ExtListing" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "413": { $ref: "#/components/responses/TooLarge" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "503": { $ref: "#/components/responses/Unavailable" }
  /api/skills/{action}:
    post:
      tags: [Tools]
      summary: Import, edit, delete, accept or enable a skill
      description: |
        Skills are addressed in the body, not the path, because their names are free text. The body depends on
        `action`:

        * `import`: either an export file, `{"format":"clawdot-skills","version":1,"skills":[...]}`, or the raw
          files of skill folders in the open SKILL.md format, `{"format":"skill-folder","files":[{"path":"tea/SKILL.md","text":".."},..]}`
          (at most 64 files, 384 KB in all). The core reads the header (`name`, `description`) and keeps the
          description apart from the instructions; small text files below a `SKILL.md` become that skill's
          helper files; scripts and other runnable or binary files are left out and listed. Every imported skill
          arrives turned off with `needs_review` true and its `source` set. Nothing in a skill is ever run. What
          was added and what was left out, with the reason, comes back as `import` in the listing.
        * `edit`: `{"name": "<current name>", "skill": {<Skill>}}` replaces that skill. Keys the body leaves
          out (`description`, `source`, `files`) keep their value; `needs_review` is never changed by an edit.
        * `delete`: `{"name": "<name>"}`.
        * `enabled`: `{"name": "<name>", "enabled": true|false}`. Turning on a skill that `needs_review` is
          refused with `400`.
        * `accept`: `{"name": "<name>"}` clears `needs_review` (the person opened the skill and accepts it). It
          does not turn the skill on.

        Any other action is `404`. The answer is the new listing.
      operationId: skillAction
      parameters:
        - name: action
          in: path
          required: true
          schema: { type: string, enum: [import, edit, delete, enabled, accept] }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
              properties:
                format: { type: string, enum: [clawdot-skills, skill-folder] }
                version: { type: integer, const: 1 }
                skills:
                  type: array
                  items: { $ref: "#/components/schemas/SkillBody" }
                files:
                  type: array
                  maxItems: 64
                  description: For `format` `skill-folder`. Paths only label the files; nothing is read from disk.
                  items: { $ref: "#/components/schemas/SkillFile" }
                name: { type: string }
                skill: { $ref: "#/components/schemas/SkillBody" }
                enabled: { type: boolean }
      responses:
        "200":
          description: Done; the new listing.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ExtListing" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "413": { $ref: "#/components/responses/TooLarge" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "503": { $ref: "#/components/responses/Unavailable" }
  /api/settings:
    get:
      tags: [Settings]
      summary: Settings, where each value came from, and what needs a restart
      description: |
        Holds no secret. A language-model key is only ever the *name* of an environment variable
        (`llm_key_env`), whether it is set (`llm.key_present`), and a masked hint of a key pasted into the
        portal (`llm.key_hint`). `null` before the settings are handed over.
      operationId: getSettings
      responses:
        "200":
          description: The listing.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Settings" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "429": { $ref: "#/components/responses/RateLimited" }
    put:
      tags: [Settings]
      summary: Save some settings
      description: |
        A JSON object of `key: value`; a `null` value removes the saved value so the default or the
        configuration file applies again. The whole change is checked first and applied all or nothing, so an
        export file's `settings` object can be sent as it is. Keys: `device_name`, `zone`, `persona`, `llm_url`,
        `llm_model`, `llm_key_env`, `voice`, `speech_language`, `speech_provider` (`openai`, `elevenlabs` or
        `deepgram`; needs a restart), `listen`, `public_url`, `daily_spend_usd`,
        `llm_usd_per_mtok_in` and `llm_usd_per_mtok_out` (what the model costs per million tokens in and out, in dollars,
        0 to 1000; empty means unknown, so the cap prices with built-in high prices, and 0 means free),
        `agent_max_rounds`, `agent_max_tool_calls`, `agent_deadline_secs`, `agent_tool_timeout_secs`,
        `plan_speech`, `progress_speech`, `notes`, `update_check`, `max_actions_per_day`, `max_costly_per_day`,
        `dry_run`, `quiet_start`, `quiet_end`, and the optional realtime voice (REQ-RTV-008) `realtime_enabled`,
        `realtime_url`, `realtime_model`, `realtime_voice`, `realtime_key_env`, `realtime_transcription_model`,
        `realtime_usd_per_min_in`, `realtime_usd_per_min_out`, `realtime_max_session_secs`. Values that apply live take effect at once; the rest are listed
        in `restart_needed`. If the running assistant could not apply them now, the answer carries a `note`.
      operationId: putSettings
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties:
                type: [string, number, boolean, "null"]
      responses:
        "200":
          description: Saved; the new listing.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Settings" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "413": { $ref: "#/components/responses/TooLarge" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "503": { $ref: "#/components/responses/Unavailable" }
  /api/settings/export:
    get:
      tags: [Settings]
      summary: The saved settings as a file
      description: "Served with `Content-Disposition: attachment; filename=\"clawdot-settings.json\"`. Load it again with `PUT /api/settings` using its `settings` object."
      operationId: exportSettings
      responses:
        "200":
          description: The export file.
          headers:
            Content-Disposition:
              schema: { type: string }
          content:
            application/json:
              schema:
                type: object
                required: [format, version, settings]
                properties:
                  format: { type: string, const: clawdot-settings }
                  version: { type: integer, const: 1 }
                  settings: { type: object, additionalProperties: true }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "503": { $ref: "#/components/responses/Unavailable" }
  /api/models:
    get:
      tags: [Settings]
      summary: The models the language-model service offers
      description: |
        Asked of the service with the saved address and key. It takes no parameters: a choice that is not saved
        yet is asked about with the `POST` form. `409` when no address is known yet; `401` when the service
        rejects the key; `502` when it cannot be asked. The page falls back to typing a name.
      operationId: listModels
      responses:
        "200": { $ref: "#/components/responses/Models" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409":
          description: Choose who answers and save first.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "502": { $ref: "#/components/responses/BadGateway" }
    post:
      tags: [Settings]
      summary: The same list, asking with a key typed on the page
      description: |
        Checks a key before it is kept, and keeps the key out of web addresses. Without `key`, the stored key
        (or the one in the saved environment variable) is used. The key is not echoed and not stored by this call.
      operationId: listModelsWithKey
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [url]
              additionalProperties: false
              properties:
                url: { type: string }
                key: { type: [string, "null"], description: "A key to try." }
      responses:
        "200": { $ref: "#/components/responses/Models" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409":
          description: Choose a provider first.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "502": { $ref: "#/components/responses/BadGateway" }
  /api/llm/key:
    put:
      tags: [Settings]
      summary: Keep the language-model key pasted on the page
      description: |
        The key is stored on the device (write-only) and used from now on. The response never contains it,
        only the masked hint.
      operationId: setLlmKey
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [key]
              additionalProperties: false
              properties:
                key: { type: string, writeOnly: true }
      responses:
        "200": { $ref: "#/components/responses/KeyHint" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "429": { $ref: "#/components/responses/RateLimited" }
    delete:
      tags: [Settings]
      summary: Forget the stored key
      operationId: clearLlmKey
      responses:
        "200": { $ref: "#/components/responses/KeyHint" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "429": { $ref: "#/components/responses/RateLimited" }
  /api/speech/key:
    put:
      tags: [Settings]
      summary: Keep the speech-service key pasted on the page
      description: |
        Same rules as `/api/llm/key`, for the key of the speech service (ElevenLabs, Deepgram, or an OpenAI-style
        server that needs one). Stored on the device (write-only); it wins over the environment variable and applies
        to the next request without a restart. The response never contains it, only the masked hint.
      operationId: setSpeechKey
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [key]
              additionalProperties: false
              properties:
                key: { type: string, writeOnly: true }
      responses:
        "200": { $ref: "#/components/responses/KeyHint" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "429": { $ref: "#/components/responses/RateLimited" }
    delete:
      tags: [Settings]
      summary: Forget the stored speech key
      operationId: clearSpeechKey
      responses:
        "200": { $ref: "#/components/responses/KeyHint" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "429": { $ref: "#/components/responses/RateLimited" }
  /api/realtime/key:
    put:
      tags: [Settings]
      summary: Keep the realtime voice key pasted on the page
      description: |
        Same rules as `/api/llm/key`, for the key of the realtime voice service. Stored on the device (write-only); it
        wins over the environment variable and applies to the next session. The response never contains it.
      operationId: setRealtimeKey
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [key]
              additionalProperties: false
              properties:
                key: { type: string, writeOnly: true }
      responses:
        "200": { $ref: "#/components/responses/KeyHint" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "429": { $ref: "#/components/responses/RateLimited" }
    delete:
      tags: [Settings]
      summary: Forget the stored realtime key
      operationId: clearRealtimeKey
      responses:
        "200": { $ref: "#/components/responses/KeyHint" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "429": { $ref: "#/components/responses/RateLimited" }
  /api/voices:
    get:
      tags: [Settings]
      summary: The voices the speech provider offers
      description: |
        `voices` is the plain list of values to send as `voice` (for ElevenLabs, voice ids, so a cloned voice is
        listed by its id). `details` repeats each with the `label` to show (a cloned voice shows the name it was
        given) and a `category` where the service says (`premade`, `cloned`, `professional`, ...). `source` is
        `server` when the provider listed them, `builtin` for a fixed set kept here (OpenAI, Deepgram). `503` when no
        speech provider is set up; `502` when the provider shares no list or could not be reached (the message says
        what to do); `401` when the speech provider did not accept the key or none is set. Use a value from
        `voices` as `voice` in `POST /api/speak`.
      operationId: listVoices
      responses:
        "200":
          description: The voices.
          content:
            application/json:
              schema:
                type: object
                required: [voices, source]
                properties:
                  voices:
                    type: array
                    items: { type: string }
                  details:
                    type: array
                    items:
                      type: object
                      required: [id, label]
                      properties:
                        id: { type: string }
                        label: { type: string }
                        category: { type: [string, "null"] }
                  source: { type: string, enum: [server, builtin] }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "502": { $ref: "#/components/responses/BadGateway" }
        "503": { $ref: "#/components/responses/Unavailable" }
  /api/hive/peers:
    get:
      tags: [Status]
      summary: This speaker's identity and the other speakers found on the network
      description: |
        Hive milestone H0 (see docs/guides/hive.md). Administrator only. `self.id` is the hex SHA-256 of the
        speaker's Ed25519 public key; the private key never leaves the device. `peers` is what mDNS discovery
        heard and is in memory only: it is advisory and unauthenticated, and entries expire when their records
        run out or the peer says goodbye. `name` is the device name only if that peer chose to publish it,
        otherwise an instance label. `404` when the build has no `hive` feature or `--hive-discovery` was not given.
      operationId: getHivePeers
      responses:
        "200":
          description: The identity and the peers.
          content:
            application/json:
              schema:
                type: object
                required: [self, discovery, peers]
                properties:
                  self:
                    type: object
                    required: [id, name, public_key, port]
                    properties:
                      id: { type: string, description: "64 hex characters." }
                      name: { type: string }
                      public_key: { type: string, description: "Ed25519 public key, 64 hex characters." }
                      port: { type: integer, description: "The portal port announced to others." }
                  discovery:
                    type: string
                    enum: [off, native, avahi]
                  peers:
                    type: array
                    items:
                      type: object
                      required: [id, name, address, port, last_seen_secs]
                      properties:
                        id: { type: string }
                        name: { type: string }
                        address: { type: string, description: "The address the announcement came from." }
                        port: { type: integer }
                        last_seen_secs: { type: integer, description: "Seconds since it last announced." }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "429": { $ref: "#/components/responses/RateLimited" }
  /api/audit:
    get:
      tags: [Activity]
      summary: What the assistant did, newest first
      description: |
        Filters combine. `decision` is a value or a prefix ending in `:` such as `blocked:`. `trigger` is
        `voice`, `event` or `event:<source>`. Page with `before` set to the last response's `next_before`.
        Argument and result text can come from outside: show it as data. `503` when there is no audit log.
      operationId: getAudit
      parameters:
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 200, default: 50 } }
        - { name: before, in: query, description: "A record id, for the next page.", schema: { type: integer, minimum: 0 } }
        - { name: since, in: query, description: "Unix seconds.", schema: { type: integer, minimum: 0 } }
        - { name: tool, in: query, schema: { type: string } }
        - { name: tier, in: query, schema: { type: string } }
        - { name: decision, in: query, schema: { type: string } }
        - { name: trigger, in: query, schema: { type: string } }
      responses:
        "200":
          description: A page of records.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AuditPage" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "503": { $ref: "#/components/responses/Unavailable" }
  /api/notes:
    get:
      tags: [Activity]
      summary: Notes (memories) the user asked to keep
      description: |
        Written only when the user asks, by voice or in the portal. Show the text as text. Up to 500 notes of 300
        characters are kept. With `q`, only the notes that share a word with it are returned, best first (the same
        ranking the assistant's `recall` tool uses), each with its `position` in the full list, the number
        voice commands use. Without `q`, every note, oldest first.
      operationId: listNotes
      parameters:
        - name: q
          in: query
          description: A few words to search for. Up to 200 characters are used. Words of one or two letters and common words are ignored.
          schema: { type: string }
      responses:
        "200":
          description: The notes.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/NotesList" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "503": { $ref: "#/components/responses/Unavailable" }
    post:
      tags: [Activity]
      summary: Write a note
      description: Goes through the same checks as a spoken "remember that". The answer is the new list. `409` when memory is off, the note is a duplicate, or the store is full.
      operationId: addNote
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/NoteText" }
      responses:
        "200":
          description: Added; the new list.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/NotesList" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409":
          description: Memory is off, a duplicate, or full.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "503": { $ref: "#/components/responses/Unavailable" }
    delete:
      tags: [Activity]
      summary: Forget every note
      operationId: clearNotes
      responses:
        "200": { $ref: "#/components/responses/Forgotten" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "500": { $ref: "#/components/responses/ServerError" }
        "503": { $ref: "#/components/responses/Unavailable" }
  /api/notes/{id}:
    put:
      tags: [Activity]
      summary: Change what one note says
      description: The answer is the new list.
      operationId: editNote
      parameters:
        - $ref: "#/components/parameters/numericId"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/NoteText" }
      responses:
        "200":
          description: Changed; the new list.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/NotesList" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: Memory is off, a duplicate, or full.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "503": { $ref: "#/components/responses/Unavailable" }
    delete:
      tags: [Activity]
      summary: Forget one note
      operationId: deleteNote
      parameters:
        - $ref: "#/components/parameters/numericId"
      responses:
        "200": { $ref: "#/components/responses/Forgotten" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "500": { $ref: "#/components/responses/ServerError" }
        "503": { $ref: "#/components/responses/Unavailable" }
  /api/logs:
    get:
      tags: [Activity]
      summary: ClawDot's recent warnings and errors
      description: Newest first, in memory since it started, redacted. No audio and none of what was said.
      operationId: getLogs
      parameters:
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 200, default: 100 } }
      responses:
        "200":
          description: The lines.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LogList" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "429": { $ref: "#/components/responses/RateLimited" }
  /api/diagnostics:
    get:
      tags: [Activity]
      summary: One document for a bug report
      description: |
        Versions and build, status, settings with their sources (the persona as a length only), webhook names
        (never tokens), counts of tools and audit records, and recent problems. No secret, audio, spoken words,
        note text or event text. Served as `clawdot-diagnostics.json` for download.
      operationId: getDiagnostics
      responses:
        "200":
          description: The document.
          headers:
            Content-Disposition:
              schema: { type: string }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Diagnostics" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "429": { $ref: "#/components/responses/RateLimited" }
  /api/about:
    get:
      tags: [Status]
      summary: Version, build and release notes
      operationId: getAbout
      responses:
        "200":
          description: The about card.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/About" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "429": { $ref: "#/components/responses/RateLimited" }
  /api/update:
    get:
      tags: [Update]
      summary: Whether a newer version exists
      description: |
        When it was last looked for, whether it can be installed here, and the progress of an install in
        `phase`. `503` when updates are not running on this device or the build has no update support.
      operationId: getUpdate
      responses:
        "200":
          description: The update status.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UpdateStatus" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "503": { $ref: "#/components/responses/Unavailable" }
  /api/update/check:
    post:
      tags: [Update]
      summary: Look for a newer version now
      description: The same document as `GET /api/update`. A failed look is in its `error` field, not an HTTP error.
      operationId: checkUpdate
      responses:
        "200":
          description: The update status after the look.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UpdateStatus" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "503": { $ref: "#/components/responses/Unavailable" }
  /api/update/apply:
    post:
      tags: [Update]
      summary: Install the version the person confirmed
      description: Starts at once; watch `GET /api/update` (`phase`). `409` when it cannot start, with the reason.
      operationId: applyUpdate
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [version]
              properties:
                version: { type: string, examples: ["1.2.3"] }
      responses:
        "202":
          description: Started.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UpdateStatus" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409":
          description: It cannot be started now.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "503": { $ref: "#/components/responses/Unavailable" }
components:
  securitySchemes:
    session:
      type: http
      scheme: bearer
      description: |
        A session token from `POST /api/login`, `POST /api/setup` (password mode), `POST /api/admin/password`
        or `POST /api/recover/window`. In *open* mode (chosen at setup, private network only) no token is
        needed from a private-network peer. Failed attempts (wrong tokens, wrong passwords) are counted per client address and end in `429` for that address only; a larger ceiling over all addresses together is the backstop.
    endpointToken:
      type: http
      scheme: bearer
      description: A webhook endpoint token (starts with `cdt_`), shown once when the endpoint is made or rotated.
    endpointTokenHeader:
      type: apiKey
      in: header
      name: X-ClawDot-Token
      description: The same endpoint token, for clients that cannot set `Authorization`.
  parameters:
    endpoint:
      name: endpoint
      in: path
      required: true
      description: The endpoint name (lowercase letters, digits, `-` and `_`, at most 32). Other names are `404`.
      schema: { type: string, maxLength: 32, pattern: "^[a-z0-9_-]+$" }
    name:
      name: name
      in: path
      required: true
      schema: { type: string }
    numericId:
      name: id
      in: path
      required: true
      description: A whole number. Anything else is `404`.
      schema: { type: integer, minimum: 0 }
  responses:
    BadRequest:
      description: The request body or a parameter is wrong; the message says what to fix.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Unauthorized:
      description: "Sign in required (or a wrong token). Carries `WWW-Authenticate: Bearer`."
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Forbidden:
      description: Setup is required first, the caller is not on a private network, or the reset window is closed.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    NotFound:
      description: No such route, item or name.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    TooLarge:
      description: The body is too large or too slow.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    RateLimited:
      description: Too many attempts. Carries `Retry-After`.
      headers:
        Retry-After:
          schema: { type: integer }
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Unavailable:
      description: Not available now (the assistant is busy or not running, or the feature is off); the message says why.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    BadGateway:
      description: The other service could not be asked; the message says why.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    ServerError:
      description: The change could not be saved.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    NotSaved:
      description: |
        The change was made in memory (an event is still announced, a timer still rings) but could not be written
        to storage, so it will be lost if the device restarts. Never a `2xx`: a success is reported only for
        something that is on disk. A sender may retry; repeats are merged.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    StorageFull:
      description: Like `500`, and the cause is a full disk.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Models:
      description: The model names.
      content:
        application/json:
          schema:
            type: object
            required: [models]
            properties:
              models:
                type: array
                items: { type: string }
    KeyHint:
      description: The masked hint of the stored key, or `null` when none is stored. Never the key.
      content:
        application/json:
          schema:
            type: object
            required: [hint]
            properties:
              hint: { type: [string, "null"], examples: ["sk-or-…cdef"] }
    Forgotten:
      description: How many notes were forgotten.
      content:
        application/json:
          schema:
            type: object
            required: [forgotten]
            properties:
              forgotten: { type: integer, minimum: 0 }
  schemas:
    Error:
      type: object
      required: [error]
      properties:
        error: { type: string, description: "A plain sentence." }
    SpeakRefusal:
      type: object
      required: [ok, reason, message, error]
      properties:
        ok: { type: boolean, const: false }
        reason: { type: string, enum: [no_voice, no_speaker, muted, busy, quiet_hours] }
        message: { type: string }
        error: { type: string, description: "The same as `message`." }
    Announcement:
      type: object
      required: [text]
      additionalProperties: false
      properties:
        text: { type: string, minLength: 1, description: "What to say (up to 2000 characters)." }
        title: { type: string }
        source: { type: string }
        priority: { type: string, enum: [low, normal, urgent], default: normal }
        reply:
          type: boolean
          default: false
          description: Whether the user may answer by voice and have the reply sent to a bridge.
        ttl_secs: { type: integer, minimum: 1, description: "How long the announcement stays valid." }
        endpoint: { type: string, maxLength: 32, description: "With an administrator session, the endpoint to use." }
    AnnounceOutcome:
      type: object
      required: [queued]
      properties:
        queued: { type: boolean }
        id: { type: integer }
        coalesced: { type: boolean }
        filtered: { type: string, enum: [muted, below_priority, ignored_kind] }
    Reply:
      type: object
      required: [id, endpoint, event_id, session_ref, kind, text, created_at]
      properties:
        id: { type: integer }
        endpoint: { type: string }
        event_id: { type: integer }
        session_ref: { type: [string, "null"] }
        kind: { type: string, enum: [ack, instruct] }
        text: { type: string, description: "Speech-to-text output; it may contain errors." }
        created_at: { type: integer }
    AuthState:
      type: object
      required: [mode, version, peer_private]
      properties:
        mode: { type: string, enum: [setup, password, open] }
        version: { type: string }
        legacy: { type: boolean }
        open_allowed: { type: boolean }
        peer_private: { type: boolean }
        reset_window_secs: { type: integer, minimum: 0 }
    SessionGrant:
      type: object
      required: [mode]
      properties:
        mode: { type: string, enum: [password, open] }
        token: { type: string, description: "A session token (password mode)." }
    Endpoint:
      type: object
      required: [name, adapter, enabled, created_at]
      properties:
        name: { type: string }
        adapter: { type: string }
        enabled: { type: boolean }
        created_at: { type: integer }
        spoken_name:
          type: [string, "null"]
          description: What the speaker says as the origin; `null` means the speaker says `name`.
    AgentEvent:
      type: object
      required: [id, endpoint, source, origin, title, text, state, received_at]
      properties:
        id: { type: integer }
        endpoint: { type: string }
        source: { type: string, description: "The label the sender gave itself. Untrusted; never spoken as the origin." }
        origin: { type: string, description: "Who the speaker names: the endpoint's spoken name, or its name." }
        title: { type: string }
        text: { type: string }
        state: { type: string, enum: [new, announced, acknowledged, dismissed, snoozed] }
        received_at: { type: integer }
    Overview:
      type: object
      required: [now, endpoints, events]
      properties:
        now: { type: integer }
        endpoints:
          type: array
          items: { $ref: "#/components/schemas/Endpoint" }
        events:
          type: array
          items: { $ref: "#/components/schemas/AgentEvent" }
    Hardware:
      type: object
      properties:
        board:
          type: string
          description: "The identifier from the configuration file's `device.board`, or `unknown` when none is set. Never guessed from the model string."
        label: { type: string, description: "What `device.label` says to call the device; empty when none is set (show `model`)." }
        model: { type: string, description: "The model string the device gives itself (device tree or firmware); empty when it says nothing." }
        cpu: { type: string }
        cores: { type: integer }
        ram_mb: { type: integer }
        arch: { type: string }
        os: { type: string }
        parts:
          type: object
          properties:
            leds: { type: boolean }
            bluetooth: { type: boolean }
            wifi: { type: boolean }
            screen: { type: boolean }
            usb_serial: { type: boolean }
        configured_parts:
          type: array
          description: "The parts whose value comes from `device.parts` in the configuration file rather than from looking at the system."
          items: { type: string, enum: [leds, bluetooth, wifi, screen, usb_serial] }
    Status:
      type: object
      description: Every field is optional; a missing field means unknown.
      properties:
        version: { type: string }
        hardware: { $ref: "#/components/schemas/Hardware" }
        clock_valid: { type: boolean }
        satellites: { type: integer, description: "Speakers connected." }
        llm:
          type: object
          properties:
            configured: { type: boolean }
            model: { type: [string, "null"] }
        usage:
          type: object
          properties:
            requests_today: { type: integer }
            spend_today: { type: number }
            spend_basis:
              type: string
              enum: [none, reported, priced, estimated]
              description: |
                What `spend_today` rests on, the weakest basis of anything counted today. `reported`: the
                provider's own cost for every request. `priced`: some cost is the provider's token counts times
                the prices the person set (`llm_usd_per_mtok_in`, `llm_usd_per_mtok_out`), or realtime audio time
                at its rates. `estimated`: some cost uses the built-in prices (a price is not set) or tokens
                counted from the size of the request and reply; the page should say "an estimate" and ask for
                the prices. `none`: nothing today has cost anything yet.
            llm_usd_per_mtok_in: { type: [number, "null"], description: "The price set per million prompt tokens; null is unset." }
            llm_usd_per_mtok_out: { type: [number, "null"], description: "The price set per million generated tokens; null is unset." }
            daily_spend_cap_usd: { type: [number, "null"] }
            day: { type: integer, description: "The local day number today is." }
            history:
              type: array
              items:
                type: object
                properties:
                  day: { type: integer }
                  requests: { type: integer }
        speaker:
          type: object
          properties:
            connected: { type: boolean }
            available: { type: boolean }
            name: { type: string, description: "`console` for terminal speech." }
            state: { type: string, enum: [idle, listening, thinking, speaking, muted] }
        voice:
          type: object
          properties:
            configured: { type: boolean }
        realtime:
          type: object
          description: The optional realtime voice (REQ-RTV-011). No key, audio or transcript.
          properties:
            configured: { type: boolean, description: "A session can start: built in, turned on, addressed, keyed." }
            active: { type: boolean, description: "A session is open." }
            last_error: { type: [string, "null"], description: "The last failure as one plain line; null after a good session." }
        muted: { type: boolean }
        quiet_hours:
          type: object
          properties:
            set: { type: boolean }
            active: { type: boolean }
        tools: { description: "Counts and names of the tools; shape not fixed.", type: [object, array, "null"] }
        stations: { type: array, items: { type: string } }
        scheduled:
          type: array
          items:
            type: object
            properties:
              kind: { type: string }
              label: { type: string }
              seconds_left: { type: integer }
    ScheduleSpec:
      type: object
      required: [kind]
      additionalProperties: false
      description: |
        `timer` needs `seconds` (1 second to 7 days). `alarm` needs `hour` and `minute`, and rings once unless
        `days` is given. `reminder` needs `label` (the text to say), `date` and `time` in the device's time zone,
        in the future and within a year. Nothing can be scheduled until the device clock is set.
      properties:
        kind: { type: string, enum: [timer, alarm, reminder] }
        label: { type: string, maxLength: 100 }
        seconds: { type: integer }
        hour: { type: integer, minimum: 0, maximum: 23 }
        minute: { type: integer, minimum: 0, maximum: 59 }
        days:
          type: array
          description: Weekdays, 0 = Monday to 6 = Sunday.
          items: { type: integer, minimum: 0, maximum: 6 }
        date: { type: string, format: date, examples: ["2026-11-09"] }
        time: { type: string, pattern: "^[0-9]{1,2}:[0-9]{2}$", examples: ["15:30"] }
    ScheduleItem:
      type: object
      required: [id, kind, label, fire_at, seconds_left]
      properties:
        id: { type: integer }
        kind: { type: string, enum: [timer, alarm, reminder] }
        label: { type: string }
        fire_at: { type: integer, description: "Unix seconds." }
        seconds_left: { type: integer }
        repeat:
          oneOf:
            - type: object
              properties:
                hour: { type: integer }
                minute: { type: integer }
                days: { type: array, items: { type: integer } }
                every_day: { type: boolean }
            - type: "null"
    ScheduleList:
      type: object
      required: [now, clock_valid, items]
      properties:
        id: { type: [integer, "null"], description: "The item that was added, changed or cancelled; null for a plain list." }
        now: { type: integer }
        clock_valid: { type: boolean }
        items:
          type: array
          items: { $ref: "#/components/schemas/ScheduleItem" }
    Tier:
      type: string
      enum: [read_only, reversible, costly, destructive]
    EnabledFlag:
      type: object
      required: [enabled]
      properties:
        enabled: { type: boolean }
    ToolParam:
      type: object
      required: [type]
      additionalProperties: false
      properties:
        type: { type: string, enum: [string, integer, number, boolean] }
        description: { type: string }
        enum: { type: array, items: { type: string } }
        required: { type: boolean }
    ToolDef:
      type: object
      required: [name, description, url]
      additionalProperties: false
      properties:
        name: { type: string, description: "Lowercase letters, digits and underscores." }
        description: { type: string }
        method: { type: string, enum: [GET, POST, PUT, DELETE], default: GET }
        url: { type: string, description: "`{param}` placeholders are allowed in the path and query, never in the host." }
        headers:
          type: object
          additionalProperties: { type: string }
        auth_env: { type: [string, "null"], description: "The *name* of an environment variable holding a bearer token." }
        params:
          type: object
          additionalProperties: { $ref: "#/components/schemas/ToolParam" }
        tier: { oneOf: [{ $ref: "#/components/schemas/Tier" }, { type: "null" }] }
        confirm: { type: boolean, default: true }
        timeout_secs: { type: [integer, "null"], minimum: 1, maximum: 30 }
    ServerDef:
      type: object
      required: [name, url]
      additionalProperties: false
      properties:
        name: { type: string, description: "Lowercase letters, digits, `-` and `_`." }
        url: { type: string, description: "The server's MCP endpoint." }
        auth_env: { type: [string, "null"], description: "The *name* of an environment variable holding a bearer token." }
        confirm: { type: boolean, default: true }
        no_confirm: { type: array, items: { type: string } }
        only: { type: array, items: { type: string } }
        tiers:
          type: object
          additionalProperties: { $ref: "#/components/schemas/Tier" }
        timeout_secs: { type: [integer, "null"], minimum: 1, maximum: 60 }
    SkillBody:
      type: object
      required: [name, instructions]
      additionalProperties: false
      properties:
        name: { type: string, maxLength: 40 }
        instructions: { type: string, maxLength: 2000 }
        tools:
          type: array
          maxItems: 16
          items: { type: string }
          description: When the user names the skill, only these tools can be used. Empty means no limit.
        enabled: { type: boolean, default: false }
        description: { type: string, maxLength: 300, description: "When to use the skill. Kept apart from the instructions." }
        source: { type: string, maxLength: 200, description: "The file it came from, for example tea/SKILL.md." }
        needs_review: { type: boolean, default: false, description: "A skill with this set is always off." }
        files:
          type: array
          maxItems: 8
          items: { $ref: "#/components/schemas/SkillFile" }
    SkillFile:
      type: object
      required: [path, text]
      additionalProperties: false
      properties:
        path: { type: string, maxLength: 100, description: "Relative, with `/`, ending in md, txt, json, yaml, yml, csv, tsv or toml." }
        text: { type: string, maxLength: 4000, description: "Plain text, shown to the model as reference text and never run. At most 16000 characters over all files of a skill." }
    Tool:
      type: object
      required: [name, description, enabled, confirm, source]
      properties:
        name: { type: string }
        description: { type: string }
        enabled: { type: boolean }
        confirm: { type: boolean }
        source: { type: string, enum: [builtin, http, mcp] }
        origin: { type: string }
        server: { type: string }
        deletable: { type: boolean }
        tier: { type: string, description: "The tier in force." }
        tier_default: { type: string, description: "The tier it was declared with." }
        tier_set: { type: boolean, description: "Whether the portal changed it." }
        tier_options: { type: array, items: { type: string } }
    McpServer:
      type: object
      required: [name, url, enabled, connected, tools]
      properties:
        name: { type: string }
        url: { type: string }
        enabled: { type: boolean }
        connected: { type: boolean, description: "Reached and its tools listed. False while `connecting` and when it failed (then `error` says why)." }
        connecting: { type: boolean, description: "Saved sources connect in the background after start-up; true until this one has answered or failed. Absent in older versions, read as false." }
        deletable: { type: boolean }
        origin: { type: string }
        error: { type: string }
        token_env: { type: string, description: "The *name* of the variable, never its value." }
        tools:
          type: array
          items: { $ref: "#/components/schemas/Tool" }
        needs_review:
          type: array
          description: >-
            Tools the server offers that the administrator has not approved as they are now. They are not in
            `tools`, are not offered to the model and cannot be called. All text here comes from the server:
            show it as plain text. Empty when nothing waits.
          items: { $ref: "#/components/schemas/ToolReview" }
    ToolReview:
      type: object
      required: [name, description, reason, reason_text, arguments]
      properties:
        name: { type: string, description: "The name the model would see; use it in the accept request." }
        description: { type: string, description: "The description the server offers now (clipped to 300 characters)." }
        reason:
          type: string
          enum: [new_tool, description_changed, arguments_changed, description_and_arguments_changed]
        reason_text: { type: string, description: "The same as a plain sentence." }
        arguments: { type: array, items: { type: string }, description: "Names of the arguments the tool takes now (at most 20)." }
    Skill:
      type: object
      required: [name, instructions, enabled]
      properties:
        name: { type: string }
        instructions: { type: string }
        tools:
          type: array
          items: { type: string }
        enabled: { type: boolean }
        description: { type: string }
        source: { type: string }
        needs_review: { type: boolean, description: "Imported and not yet accepted; it cannot be turned on." }
        files:
          type: array
          items: { $ref: "#/components/schemas/SkillFile" }
    ExtListing:
      type: object
      properties:
        tools:
          type: array
          items: { $ref: "#/components/schemas/Tool" }
        mcp:
          type: array
          items: { $ref: "#/components/schemas/McpServer" }
        skills:
          type: array
          items: { $ref: "#/components/schemas/Skill" }
        import:
          description: What the last skill import did. Null before any import.
          type: [object, "null"]
          properties:
            added: { type: integer }
            skipped: { type: array, items: { type: string } }
        problems:
          type: array
          description: Portal entries that could not be loaded.
          items:
            type: object
            required: [kind, name, reason]
            properties:
              kind: { type: string }
              name: { type: string }
              reason: { type: string }
    ConnectionTest:
      type: object
      required: [connected]
      additionalProperties: true
      properties:
        name: { type: string }
        connected: { type: boolean, const: true }
        tools:
          type: array
          items:
            type: object
            required: [name]
            properties:
              name: { type: string }
    SettingField:
      type: object
      required: [value, source]
      properties:
        value: { type: [string, number, boolean, "null"] }
        source: { type: string, enum: [default, file, saved, flag] }
        live: { type: boolean, description: "Whether a change applies without a restart." }
        saved: { type: boolean }
        ignored: { type: boolean, description: "A saved value hidden by a command-line flag." }
    Settings:
      type: object
      required: [fields]
      properties:
        fields:
          type: object
          additionalProperties: { $ref: "#/components/schemas/SettingField" }
        restart_needed:
          type: array
          items: { type: string }
        llm:
          type: object
          properties:
            configured: { type: boolean }
            key_present: { type: boolean }
            key_hint:
              type: [string, "null"]
              description: The first and last few characters of the pasted key. Never the key.
        realtime:
          type: object
          description: The optional realtime voice (REQ-RTV-008). Never the key.
          properties:
            configured: { type: boolean, description: "Built in, turned on, addressed and has a key." }
            built: { type: boolean, description: "This build includes the `realtime` feature." }
            provider: { type: string, examples: [openai] }
            key_hint:
              type: [string, "null"]
              description: The first and last few characters of a key pasted into the portal. Never the key.
        speech:
          type: object
          description: The speech-service key, with the same rules as the language-model one.
          properties:
            key_present: { type: boolean, description: "A pasted key, or the named environment variable, is in place." }
            key_hint:
              type: [string, "null"]
              description: The first and last few characters of the pasted speech key. Never the key.
        speech_key_env:
          type: [string, "null"]
          description: The NAME of the environment variable the speech key is read from when none is pasted.
        speech_configured: { type: boolean }
        voice_info:
          type: object
          properties:
            dialect: { type: string, enum: [openai, elevenlabs, deepgram], description: "The speech provider in use (`speech_provider`)." }
            language: { type: string }
            stt_model: { type: string }
            tts_model: { type: string }
            provider: { type: [string, "null"] }
        speakers_listen: { type: string }
        note: { type: string }
    AuditRecord:
      type: object
      required: [id, ts, turn, trigger, tool, tier, args, decision]
      properties:
        id: { type: integer }
        ts: { type: integer }
        turn: { type: integer }
        trigger: { type: string }
        tool: { type: string }
        tier: { type: string }
        args: { description: "Can come from outside; show as data." }
        decision: { type: string }
        held_id: { type: integer }
        dry_run: { type: boolean }
        status: { type: string }
        result: { type: string }
        detail: { type: string }
        turn_cost_usd: { type: number }
        note: { type: string }
    AuditPage:
      type: object
      required: [records, next_before, log, policy]
      properties:
        records:
          type: array
          items: { $ref: "#/components/schemas/AuditRecord" }
        next_before: { type: [integer, "null"] }
        log:
          type: object
          properties:
            bytes: { type: integer }
            max_file_bytes: { type: integer }
            corrupt_lines: { type: integer }
            write_errors: { type: integer }
        policy:
          type: object
          properties:
            dry_run: { type: boolean }
            max_actions_per_day: { type: integer }
            max_costly_per_day: { type: integer }
        note: { type: string }
    NoteText:
      type: object
      required: [text]
      additionalProperties: false
      properties:
        text: { type: string }
    Note:
      type: object
      required: [id, text, ts]
      properties:
        id: { type: integer }
        text: { type: string }
        ts: { type: integer }
        position: { type: integer, description: "1-based place in the full list. Only in search results (`q`)." }
    NotesList:
      type: object
      required: [enabled, notes, limits]
      properties:
        enabled: { type: boolean }
        query: { type: string, description: "The search text used. Only when `q` was given." }
        notes:
          type: array
          items: { $ref: "#/components/schemas/Note" }
        limits:
          type: object
          properties:
            max_notes: { type: integer }
            max_note_chars: { type: integer }
            max_total_bytes: { type: integer }
        note: { type: string }
    LogList:
      type: object
      required: [lines, max_lines]
      properties:
        lines:
          type: array
          items:
            type: object
            required: [ts, level, text]
            properties:
              ts: { type: integer }
              level: { type: string }
              text: { type: string }
        max_lines: { type: integer }
        note: { type: string }
    Diagnostics:
      type: object
      required: [format]
      additionalProperties: true
      properties:
        format: { type: string, const: clawdot-diagnostics }
        generated_at: { type: integer }
        version: { type: string }
        build: { $ref: "#/components/schemas/BuildInfo" }
        status: { description: "The same as `status` in `GET /api/status`." }
        settings: { type: object, additionalProperties: true }
        endpoints:
          type: array
          items: { $ref: "#/components/schemas/Endpoint" }
        tools: { type: object, additionalProperties: true }
        audit: { type: [object, "null"], additionalProperties: true }
        recent_problems: { type: array, items: { type: object, additionalProperties: true } }
        note: { type: string }
    BuildInfo:
      type: object
      properties:
        version: { type: string, description: "The release version. Unchanged by the commit; the updater compares this." }
        commit: { type: string, description: "Short git commit the program was built from, or `unknown` when built without git." }
        dirty: { type: boolean, description: "Whether tracked files differed from the commit at build time." }
        id: { type: string, description: "Version and commit as one line, such as `0.0.0 (a1b2c3d4e-dirty)`; the same text `clawdot --version` prints after the name." }
        profile: { type: string }
        os: { type: string }
        arch: { type: string }
        features:
          type: array
          items: { type: string }
    About:
      type: object
      required: [version, changelog]
      properties:
        version: { type: string }
        build: { $ref: "#/components/schemas/BuildInfo" }
        changelog: { type: string, description: "The release notes as Markdown text." }
    UpdateStatus:
      type: object
      properties:
        current: { type: string }
        enabled: { type: boolean }
        source: { type: string }
        checking: { type: boolean }
        last_checked: { type: [integer, "null"] }
        error: { type: [string, "null"] }
        available: { type: boolean }
        latest:
          oneOf:
            - type: object
              properties:
                version: { type: string }
                notes: { type: string }
                page: { type: string }
                published: { type: string }
            - type: "null"
        can_apply: { type: boolean }
        cannot_apply_because: { type: [string, "null"] }
        supervised: { type: boolean }
        phase:
          type: string
          description: Empty when idle; otherwise downloading, verifying, installing, installed, restarting or failed.
        apply_error: { type: [string, "null"] }
        installed: { type: [string, "null"] }
