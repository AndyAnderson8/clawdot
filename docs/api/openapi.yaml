          content:
            application/json:
              schema: { $ref: "#/components/schemas/ExtListing" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "429": { $ref: "#/components/responses/RateLimited" }
    post:
      tags: [Tools]
      summary: Add an HTTP tool
      description: |
        Body is a tool definition as in the configuration file (see `docs/architecture/http-tools.md`). The
