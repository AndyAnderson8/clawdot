openapi: 3.1.0
info:
  title: ClawDot core HTTP API
  version: 1.0.0
  summary: The JSON API the portal uses, and the webhook endpoints other programs post to.
  description: |
    Hand-written from `crates/core/src/ui.rs`, `crates/core/src/http.rs` and `crates/core/src/announce_api.rs`,
    with response shapes taken from `portal/src/types.ts`. A test (`crates/core/tests/openapi.rs`) fails when the
    set of `METHOD path` pairs here differs from the routes in the code. See `docs/api/README.md`.

    **Errors.** Every failure from the portal API is a JSON object `{"error": "<plain sentence>"}` with a
    matching status code. Treat the text as data to show, not as something to parse. `POST /api/speak` adds
    `ok`, `reason` and `message` when the speaker cannot say the phrase.

    **No secrets in responses.** Passwords and tokens are stored hashed. A token is returned once, when it is
    made or rotated. The language-model key pasted into the portal is never returned: only a masked hint such
    as `sk-or-...cdef` (its first and last few characters). Settings hold only the *name* of an environment
    variable for a key, never the key. Diagnostics hold no secret, audio, spoken words, note text or event text.

    **Untrusted text.** Event titles and text, note text, tool results and audit arguments can come from
    outside ClawDot. Show them as text, never as HTML.

    **Limits.** Most request bodies are limited to 4 KiB; tool, connection, settings and skills bodies to 16 KiB
    or 64 KiB; the announce endpoint to 32 KiB. A body that is too large or too slow gets `413`.
  license:
    name: See the repository licence
    identifier: NOASSERTION
servers:
  - url: http://clawdot.local:8080
    description: The device. The address and port are whatever `listen` is set to.
tags:
  - name: Session
    description: Mode, first-run setup, sign-in and sign-out. Works without a session token.
  - name: Status
    description: What the assistant is doing.
  - name: Speak
    description: Make the speaker say a phrase.
  - name: Webhooks
    description: Endpoints other programs post to. Each uses an endpoint token, not a session.
  - name: Schedule
    description: Timers, alarms and reminders.
  - name: Tools
    description: Tools, connections (MCP servers) and skills.
  - name: Settings
    description: Saved settings and the language-model key.
  - name: Activity
    description: Audit log, notes (memories), logs and diagnostics.
  - name: Update
    description: Checking for and installing a newer version.
security:
  - session: []
paths:
  /healthz:
    get:
      tags: [Status]
      summary: Liveness check
      operationId: healthz
      security: []
      responses:
        "200":
          description: The core is up.
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status: { type: string, const: ok }
  /hook/{endpoint}:
    post:
      tags: [Webhooks]
      summary: An agent posts its native hook payload
      description: |
        The body is the hook payload of the agent the endpoint's adapter was made for (for example Claude Code).
        The adapter turns it into an event for the inbox. The response body is always `{}` on success, on
        purpose: agent runtimes parse hook responses as hook output. The event id is in the `X-ClawDot-Event`
        header, for example `accepted; id=12`, `coalesced; id=12` or `filtered; id=0`.
        Authenticate with the endpoint token, as `Authorization: Bearer <token>` or `X-ClawDot-Token: <token>`.
      operationId: postHook
      security: [{ endpointToken: [] }, { endpointTokenHeader: [] }]
      parameters:
        - $ref: "#/components/parameters/endpoint"
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, additionalProperties: true }
      responses:
        "202":
          description: Accepted (queued, coalesced into an earlier event, or filtered out by policy).
          headers:
            X-ClawDot-Event:
              description: "`accepted; id=N`, `coalesced; id=N` or `filtered; id=0`."
              schema: { type: string }
          content:
            application/json:
              schema: { type: object, maxProperties: 0 }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "413": { $ref: "#/components/responses/TooLarge" }
        "422":
          description: The endpoint's adapter has no rule for this payload, or is not installed.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "500": { $ref: "#/components/responses/NotSaved" }
        "507": { $ref: "#/components/responses/StorageFull" }
  /bridge/{endpoint}/replies:
    get:
      tags: [Webhooks]
      summary: Stream of replies for an agent bridge (server-sent events)
      description: |
        Each reply is an SSE event named `reply` whose id is the reply id and whose data is a JSON `Reply`.
        Comments (`: keepalive`) arrive when idle. Replies stay queued until acknowledged and are re-sent to a
        reconnecting bridge. The stream ends when the token is rotated or revoked. One stream per connection.
      operationId: streamReplies
      security: [{ endpointToken: [] }, { endpointTokenHeader: [] }]
      parameters:
        - $ref: "#/components/parameters/endpoint"
      responses:
        "200":
          description: An event stream.
          content:
            text/event-stream:
              schema:
                type: string
                description: "Events of the form `id: N`, `event: reply`, `data: <Reply as JSON>`."
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "503":
          description: Too many streams are open.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
  /bridge/{endpoint}/replies/{id}/ack:
    post:
      tags: [Webhooks]
      summary: The bridge confirms it handled a reply
      operationId: ackReply
      security: [{ endpointToken: [] }, { endpointTokenHeader: [] }]
      parameters:
        - $ref: "#/components/parameters/endpoint"
        - name: id
          in: path
          required: true
          description: The reply id.
          schema: { type: integer, minimum: 0 }
      responses:
        "204": { description: "Acknowledged." }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "500": { $ref: "#/components/responses/NotSaved" }
        "507": { $ref: "#/components/responses/StorageFull" }
  /api/announce:
    post:
      tags: [Webhooks]
      summary: A script says something
      description: |
        One-way announcement. Authenticate with an endpoint token (it starts with `cdt_`; it identifies the
        endpoint) or as the administrator (a session token, then `endpoint` names the endpoint to use). Every
        refusal for a caller without credentials is `401`, or `429` when that caller's address has used up its budget of failed attempts.
        The response never repeats the text.
      operationId: announce
      security: [{ endpointToken: [] }, { endpointTokenHeader: [] }, { session: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/Announcement" }
      responses:
        "202":
          description: Queued, or filtered out by the endpoint's policy.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AnnounceOutcome" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "413": { $ref: "#/components/responses/TooLarge" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "500": { $ref: "#/components/responses/NotSaved" }
        "507": { $ref: "#/components/responses/StorageFull" }
  /mcp:
    post:
      tags: [Webhooks]
      summary: The ClawDot MCP server
      description: |
        Model Context Protocol, revision 2025-06-18, Streamable HTTP, stateless and answered with plain JSON
        (no event stream, no session id). One JSON-RPC message per request: `initialize`, `ping`, `tools/list`
        and `tools/call`; a notification gets `202` with no body. The two tools are `announce` (say a short
        message) and `ask_user` (ask the person a question aloud; the answer comes back as untrusted data and
        is never a confirmation of any action). Authenticate with an endpoint token only; an administrator
        session is not accepted. Tool failures are `200` with `isError: true`; that includes an `announce` or `ask_user` whose message could not be saved to storage (an `ask_user` that fails this way is withdrawn and not spoken). `ask_user` holds the request
        open up to its `timeout_secs` (1 to 300, default 60). `GET` and `DELETE` are `405`.
      operationId: mcp
      security: [{ endpointToken: [] }, { endpointTokenHeader: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [jsonrpc, method]
              properties:
                jsonrpc: { type: string, enum: ["2.0"] }
                id: { description: "Absent for a notification.", oneOf: [{ type: string }, { type: integer }] }
                method: { type: string, enum: [initialize, ping, tools/list, tools/call, notifications/initialized] }
                params: { type: object }
      responses:
        "200":
          description: A JSON-RPC response (a result, or an error object).
          content:
            application/json:
              schema: { type: object }
        "202": { description: "A notification was accepted; no body." }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "413": { $ref: "#/components/responses/TooLarge" }
        "429": { $ref: "#/components/responses/RateLimited" }
  /api/auth:
    get:
      tags: [Session]
      summary: Which mode the portal is in
      description: Works without signing in. `reset_window_secs` is 0 for callers outside the private network.
      operationId: getAuth
      security: []
      responses:
        "200":
          description: The mode and what the page should offer.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AuthState" }
  /api/setup:
    post:
      tags: [Session]
      summary: First-run setup
      description: |
        Choose a password (the response carries a session token) or open mode. Only from a private address, and
        only while the mode is `setup`. Shares the authentication rate limit.
      operationId: setup
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [mode]
              additionalProperties: false
              properties:
                mode: { type: string, enum: [password, open] }
                password:
                  type: string
                  minLength: 8
                  maxLength: 128
                  description: Required for `mode` `password`.
      responses:
        "200":
          description: Set up. `token` is present for `password` mode.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SessionGrant" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409":
          description: Setup is already complete.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "429": { $ref: "#/components/responses/RateLimited" }
  /api/login:
    post:
      tags: [Session]
      summary: Sign in
      description: |
        Exchange the password (or, after an upgrade, the old administrator token) for a session token.
        `409` when no password is set (open mode).
      operationId: login
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [password]
              additionalProperties: false
              properties:
                password: { type: string }
      responses:
        "200":
          description: Signed in.
          content:
            application/json:
              schema:
                type: object
                required: [token]
                properties:
                  token: { type: string, description: "Use as `Authorization: Bearer <token>`." }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409":
          description: No password is set.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "429": { $ref: "#/components/responses/RateLimited" }
  /api/logout:
    post:
      tags: [Session]
      summary: End the session
      description: Always succeeds, with or without a token.
      operationId: logout
      security: []
      responses:
        "200":
          description: Signed out.
          content:
            application/json:
              schema:
                type: object
                required: [signed_out]
                properties:
                  signed_out: { type: boolean, const: true }
  /api/recover/window:
    post:
      tags: [Session]
      summary: Set a new password during the local reset window
      description: |
        Only from a private address and only while the reset window is open (see `reset_window_secs` in
        `GET /api/auth`).
      operationId: recoverWindow
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [password]
              additionalProperties: false
              properties:
                password: { type: string, minLength: 8, maxLength: 128 }
      responses:
        "200":
          description: New password set; a session token is returned.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SessionGrant" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "429": { $ref: "#/components/responses/RateLimited" }
  /api/admin/password:
    post:
      tags: [Session]
      summary: Change the administrator password
      description: |
        In password mode the current password must be given and is checked like a sign-in: it spends an attempt
        from the caller's address budget (a wrong guess is not given back; a right one is). In open mode a
        private-network caller may set the first password without one; that is written to the audit log and the
        problem log.
      operationId: changePassword
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [password]
              additionalProperties: false
              properties:
                password: { type: string, minLength: 8, maxLength: 128, description: "The new password." }
                current:
                  type: string
                  description: |
                    The password in force now. **Required in password mode** (for an installation that still has
                    the old administrator token, that token is the current password). A missing or wrong value is
                    `403`. In open mode there is no password to give and this field is ignored.
      responses:
        "200":
          description: Changed. Every other session ends and a new session token is returned.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SessionGrant" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403":
          description: |
            Password mode and `current` is missing or wrong (`"the current password is missing or wrong"`;
            this is `403`, not `401`, so the signed-in session is kept), or setup is required first, or the caller
            is not on a private network (open mode).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "500": { $ref: "#/components/responses/ServerError" }
  /api/overview:
    get:
      tags: [Status]
      summary: Webhook endpoints and recent agent events
      description: Up to 50 events, newest first. Titles and text are clipped to 600 characters.
      operationId: getOverview
      responses:
        "200":
          description: The overview.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Overview" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "429": { $ref: "#/components/responses/RateLimited" }
  /api/status:
    get:
      tags: [Status]
      summary: What the assistant is doing
      description: |
        A snapshot published by the main loop: model, speaker, voice, usage, hardware, quiet hours, tools and
        scheduled items. It holds no secrets and no agent text. Before the first snapshot, `status` is `null`.
        A missing field means unknown, not false.
      operationId: getStatus
      responses:
        "200":
          description: The snapshot.
          content:
            application/json:
              schema:
                type: object
                required: [now, status]
                properties:
                  now: { type: integer, description: "Unix seconds." }
                  status:
                    oneOf:
                      - $ref: "#/components/schemas/Status"
                      - type: "null"
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "429": { $ref: "#/components/responses/RateLimited" }
  /api/speak:
    post:
      tags: [Speak]
      summary: The speaker says a phrase ("test speak")
      description: |
        Queues a phrase of up to 200 characters. `voice` is an optional voice name to try for this one phrase,
        so it can be heard before it is saved (see `GET /api/voices`). Refused, with `ok: false` and a
        `reason`, when there is nothing to say it with: `no_voice` (503), `no_speaker`, `muted` or `busy` (409,
        also when the last phrase is still being said). The `console` speaker needs neither a voice nor a
        satellite.
      operationId: speak
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [text]
              additionalProperties: false
              properties:
                text: { type: string, minLength: 1, maxLength: 200 }
                voice:
                  type: [string, "null"]
                  maxLength: 128
                  description: A voice for this phrase; no control characters.
      responses:
        "202":
          description: Queued.
          content:
            application/json:
              schema:
                type: object
                required: [ok, queued]
                properties:
                  ok: { type: boolean, const: true }
                  queued: { type: boolean, const: true }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409":
          description: No speaker, muted, or busy.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SpeakRefusal" }
        "413": { $ref: "#/components/responses/TooLarge" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "503":
          description: No voice is set up.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SpeakRefusal" }
  /api/endpoints:
    post:
      tags: [Webhooks]
      summary: Create a webhook endpoint
      description: The token is returned once. Only its hash is kept.
      operationId: createEndpoint
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, adapter]
              additionalProperties: false
              properties:
                name:
                  type: string
                  maxLength: 32
                  pattern: "^[a-z0-9_-]+$"
                adapter: { type: string, description: "An installed adapter, for example `claude-code`." }
                spoken_name:
                  type: [string, "null"]
                  maxLength: 40
                  description: >-
                    Optional. The words the speaker names as the origin of this endpoint's messages ("From the
                    kitchen: ..."). Plain words only (letters, digits, single spaces, `-` `_` `'` `.`); `400` otherwise.
                    Only an administrator sets it; a sender's `source` is never spoken as the origin.
      responses:
        "201":
          description: Created.
          content:
            application/json:
              schema:
                type: object
                required: [name, adapter, token]
                properties:
                  name: { type: string }
                  adapter: { type: string }
                  spoken_name: { type: [string, "null"] }
                  token: { type: string, description: "Shown once." }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409":
          description: An endpoint with that name exists.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "413": { $ref: "#/components/responses/TooLarge" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "500": { $ref: "#/components/responses/NotSaved" }
        "507": { $ref: "#/components/responses/StorageFull" }
  /api/endpoints/{name}:
    put:
      tags: [Webhooks]
      summary: Set or clear an endpoint's spoken name
      description: >-
        The words the speaker names as the origin of this endpoint's messages. `null` or blank clears it, and the
        endpoint's own name is spoken again. Messages already queued follow the change. Administrator only.
      operationId: updateEndpoint
      parameters:
        - $ref: "#/components/parameters/name"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [spoken_name]
              additionalProperties: false
              properties:
                spoken_name: { type: [string, "null"], maxLength: 40 }
      responses:
        "200":
          description: The endpoint as now stored.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Endpoint" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "413": { $ref: "#/components/responses/TooLarge" }
        "429": { $ref: "#/components/responses/RateLimited" }
    delete:
      tags: [Webhooks]
      summary: Revoke a webhook endpoint
      operationId: deleteEndpoint
      parameters:
        - $ref: "#/components/parameters/name"
      responses:
        "200":
          description: Deleted.
          content:
            application/json:
              schema:
                type: object
                required: [deleted]
                properties:
                  deleted: { type: string }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "500": { $ref: "#/components/responses/NotSaved" }
        "507": { $ref: "#/components/responses/StorageFull" }
  /api/endpoints/{name}/rotate:
    post:
      tags: [Webhooks]
      summary: Issue a new token for an endpoint
      description: The old token stops working at once. The new one is returned once.
      operationId: rotateEndpoint
      parameters:
        - $ref: "#/components/parameters/name"
      responses:
        "200":
          description: Rotated.
          content:
            application/json:
              schema:
                type: object
                required: [name, token]
                properties:
                  name: { type: string }
                  token: { type: string }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "500": { $ref: "#/components/responses/NotSaved" }
        "507": { $ref: "#/components/responses/StorageFull" }
  /api/schedule:
    get:
      tags: [Schedule]
      summary: List timers, alarms and reminders
      operationId: listSchedule
      responses:
        "200":
          description: The list.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ScheduleList" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "503": { $ref: "#/components/responses/Unavailable" }
    post:
      tags: [Schedule]
      summary: Add a timer, alarm or reminder
      description: The answer is the whole list; `id` is the new item.
      operationId: addSchedule
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ScheduleSpec" }
      responses:
        "200":
          description: Added.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ScheduleList" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "500": { $ref: "#/components/responses/NotSaved" }
        "507": { $ref: "#/components/responses/StorageFull" }
        "503": { $ref: "#/components/responses/Unavailable" }
  /api/schedule/{id}:
    put:
      tags: [Schedule]
      summary: Replace an item
      description: Same body as adding; the item keeps its id. If the new spec is invalid, the old item is kept.
      operationId: editSchedule
      parameters:
        - $ref: "#/components/parameters/numericId"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ScheduleSpec" }
      responses:
        "200":
          description: Replaced.
          content:
            application/json:
