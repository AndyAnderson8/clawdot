[package]
name = "clawdot-core"
description = "ClawDot core: the assistant program with its language-model turns, tool gate, agent inbox, timers, satellite server, MCP client and server, updater, and embedded web portal"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lints]
workspace = true

[features]
default = ["tz", "tls"]
# IANA time-zone support with a bundled database (correct daylight-saving behaviour, no OS tzdata needed).
tz = ["dep:jiff"]
# HTTPS to the language-model provider (rustls, bundled roots). Without it only http:// endpoints work.
tls = ["dep:tokio-rustls", "dep:rustls", "dep:webpki-roots", "dep:ring"]
# Client for ESPHome voice satellites (spec 0004): dials a Dot or other ESPHome device with no Home Assistant.
# Plaintext API only; adds no dependency. Off by default.
esphome-satellite = []
# Noise encryption for the ESPHome client (REQ-ESP-014), built on `ring`, which the tls feature already pulls in.
esphome-noise = ["esphome-satellite", "dep:ring"]

# Optional realtime (speech-to-speech) voice (ADR-0020, REQ-RTV-001): one streaming WebSocket to a provider
# instead of separate listen, think and speak steps. Meant for a PC or Pi. Adds no crate (a minimal
# WebSocket client is built in) and uses the TLS stack the `tls` feature already has. Off by default.
realtime = ["tls"]

# Hive (docs/research/14-hive.md, milestone H0): a persistent Ed25519 device identity and mDNS/DNS-SD discovery of other
# speakers on the home network. Identity uses `ring`, which the default `tls` feature already links; mDNS is a small
# hand-written responder over tokio UDP plus `socket2`, which tokio's `net` feature already compiles. No new crate.
# Off by default, and even when built in nothing is sent until `--hive-discovery` is given.
hive = ["dep:ring", "dep:socket2"]

[[bin]]
name = "clawdot"
path = "src/main.rs"

[dependencies]
clawdot-protocol = { path = "../protocol" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
getrandom = "0.3"
tokio = { version = "1", default-features = false, features = ["rt", "net", "time", "sync", "macros", "io-util"] }
hyper = { version = "1", default-features = false, features = ["http1", "server", "client"] }
hyper-util = { version = "0.1", default-features = false, features = ["tokio"] }
http-body-util = "0.1"
jiff = { version = "0.2", default-features = false, features = ["std", "tzdb-bundle-always"], optional = true }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"], optional = true }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"], optional = true }
webpki-roots = { version = "1", optional = true }
ring = { version = "0.17", default-features = false, features = ["alloc"], optional = true }
socket2 = { version = "0.6", features = ["all"], optional = true }

# Build time only: compresses the portal page (REQ-CFG-043). Not linked into the program.
[build-dependencies]
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }

[dev-dependencies]
tokio = { version = "1", default-features = false, features = ["rt", "net", "time", "sync", "macros", "io-util"] }
