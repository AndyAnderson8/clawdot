[package]
name = "clawdot-e2e"
description = "End-to-end tests and the satellite protocol conformance harness: a fake satellite and a fake core, the real core over HTTP and TCP, the real bridge client (a test crate, not part of the product)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
clawdot-protocol = { path = "../protocol" }

[dev-dependencies]
clawdot-core = { path = "../core", features = ["esphome-noise"] }
clawdot-bridge = { path = "../bridge" }
clawdot-satellite = { path = "../satellite" }
tokio = { version = "1", default-features = false, features = ["rt", "net", "time", "sync", "macros", "io-util"] }
