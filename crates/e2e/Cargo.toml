[package]
name = "clawdot-e2e"
description = "End-to-end tests: real HTTP server, real bridge client, voice fast path"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
clawdot-protocol = { path = "../protocol" }

[dev-dependencies]
clawdot-core = { path = "../core", features = ["esphome-satellite"] }
clawdot-bridge = { path = "../bridge" }
clawdot-satellite = { path = "../satellite" }
tokio = { version = "1", default-features = false, features = ["rt", "net", "time", "sync", "macros", "io-util"] }
